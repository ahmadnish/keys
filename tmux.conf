# Optional isolated tmux server: tmux -L keys -f /path/to/tmux.conf new
set -g mode-keys emacs
bind-key -n S-Left copy-mode \; send-keys -X begin-selection \; send-keys -X cursor-left
bind-key -T copy-mode S-Left if-shell -F '#{selection_present}' 'send-keys -X cursor-left' 'send-keys -X begin-selection; send-keys -X cursor-left'
bind-key -T copy-mode-vi S-Left if-shell -F '#{selection_present}' 'send-keys -X cursor-left' 'send-keys -X begin-selection; send-keys -X cursor-left'
bind-key -n S-Right copy-mode \; send-keys -X begin-selection \; send-keys -X cursor-right
bind-key -T copy-mode S-Right if-shell -F '#{selection_present}' 'send-keys -X cursor-right' 'send-keys -X begin-selection; send-keys -X cursor-right'
bind-key -T copy-mode-vi S-Right if-shell -F '#{selection_present}' 'send-keys -X cursor-right' 'send-keys -X begin-selection; send-keys -X cursor-right'
bind-key -n S-Up copy-mode \; send-keys -X begin-selection \; send-keys -X cursor-up
bind-key -T copy-mode S-Up if-shell -F '#{selection_present}' 'send-keys -X cursor-up' 'send-keys -X begin-selection; send-keys -X cursor-up'
bind-key -T copy-mode-vi S-Up if-shell -F '#{selection_present}' 'send-keys -X cursor-up' 'send-keys -X begin-selection; send-keys -X cursor-up'
bind-key -n S-Down copy-mode \; send-keys -X begin-selection \; send-keys -X cursor-down
bind-key -T copy-mode S-Down if-shell -F '#{selection_present}' 'send-keys -X cursor-down' 'send-keys -X begin-selection; send-keys -X cursor-down'
bind-key -T copy-mode-vi S-Down if-shell -F '#{selection_present}' 'send-keys -X cursor-down' 'send-keys -X begin-selection; send-keys -X cursor-down'
bind-key -n S-Home copy-mode \; send-keys -X begin-selection \; send-keys -X start-of-line
bind-key -T copy-mode S-Home if-shell -F '#{selection_present}' 'send-keys -X start-of-line' 'send-keys -X begin-selection; send-keys -X start-of-line'
bind-key -T copy-mode-vi S-Home if-shell -F '#{selection_present}' 'send-keys -X start-of-line' 'send-keys -X begin-selection; send-keys -X start-of-line'
bind-key -n S-End copy-mode \; send-keys -X begin-selection \; send-keys -X end-of-line
bind-key -T copy-mode S-End if-shell -F '#{selection_present}' 'send-keys -X end-of-line' 'send-keys -X begin-selection; send-keys -X end-of-line'
bind-key -T copy-mode-vi S-End if-shell -F '#{selection_present}' 'send-keys -X end-of-line' 'send-keys -X begin-selection; send-keys -X end-of-line'
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T copy-mode Enter send-keys -X copy-selection-and-cancel
